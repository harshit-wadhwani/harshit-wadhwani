<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Harshit Wadhwani, AI Engineer</title>
  <desc id="desc">Profile banner for Harshit Wadhwani, an AI engineer building generative AI and agentic systems.</desc>

  <defs>
